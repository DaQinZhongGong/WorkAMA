openapi: 3.1.0
info:
  title: WorkAMA API
  version: 0.1.0
  description: Implemented P0 vertical-slice contract. The full P3 registry remains governed by WorkAMA-Docs/720.
servers:
  - url: http://localhost:20200/api/v1
paths:
  /auth/register:
    post:
      operationId: registerUser
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/AuthResponse' }
  /auth/login:
    post:
      operationId: loginUser
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
  /auth/me:
    get:
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      tags: [Identity]
      responses:
        '200':
          description: Current actor and tenant context
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
  /sessions:
    get:
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      tags: [Agent]
      responses: { '200': { description: Session page } }
    post:
      operationId: createSession
      security: [{ bearerAuth: [] }]
      tags: [Agent]
      responses: { '201': { description: Session created } }
  /sessions/{sessionId}/events:
    get:
      operationId: listSessionEvents
      security: [{ bearerAuth: [] }]
      tags: [Agent]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer, default: 0 } }
      responses: { '200': { description: Append-only event page } }
  /sessions/{sessionId}/attachments:
    post:
      operationId: uploadSessionAttachment
      security: [{ bearerAuth: [] }]
      tags: [Agent]
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses: { '201': { description: Attachment accepted } }
  /sessions/{sessionId}/ws-tickets:
    post:
      operationId: createSessionWebSocketTicket
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      security: [{ bearerAuth: [] }]
      tags: [Agent]
      responses: { '200': { description: 60-second one-time ticket } }
  /gateway/channels:
    get:
      operationId: listGatewayChannels
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      responses: { '200': { description: Channel page } }
    post:
      operationId: createGatewayChannel
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      responses: { '201': { description: Channel created } }
  /gateway/model-mappings:
    get:
      operationId: listGatewayModelMappings
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      responses: { '200': { description: Workspace model mapping page } }
    post:
      operationId: createGatewayModelMapping
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayModelMappingRequest' }
      responses: { '201': { description: Model mapping created or updated } }
  /gateway/model-mappings/{mappingId}:
    delete:
      operationId: deleteGatewayModelMapping
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      parameters:
        - { name: mappingId, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: Model mapping removed } }
  /gateway/tokens:
    get:
      operationId: listGatewayTokens
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      responses: { '200': { description: Token page } }
    post:
      operationId: createGatewayToken
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayTokenCreateRequest' }
      responses: { '201': { description: Token created; plaintext appears once } }
  /gateway/token-groups:
    get:
      operationId: listGatewayTokenGroups
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      responses: { '200': { description: Workspace token group page } }
    post:
      operationId: createGatewayTokenGroup
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayTokenGroupRequest' }
      responses: { '201': { description: Token group created } }
  /gateway/token-groups/{groupId}:
    get:
      operationId: getGatewayTokenGroup
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Token group detail } }
    patch:
      operationId: updateGatewayTokenGroup
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GatewayTokenGroupRequest' }
      responses: { '200': { description: Token group updated } }
    delete:
      operationId: deleteGatewayTokenGroup
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: Token group removed and keys detached } }
  /gateway/usage:
    get:
      operationId: getGatewayUsage
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      responses: { '200': { description: Usage aggregate } }
  /gateway/logs:
    get:
      operationId: listGatewayLogs
      security: [{ bearerAuth: [] }]
      tags: [Gateway]
      responses: { '200': { description: Request log page } }
  /billing/account:
    get:
      operationId: getBillingAccount
      security: [{ bearerAuth: [] }]
      tags: [Billing]
      responses: { '200': { description: Dual-pool credit account } }
  /billing/transactions:
    get:
      operationId: listBillingTransactions
      security: [{ bearerAuth: [] }]
      tags: [Billing]
      responses: { '200': { description: Ledger page } }
  /privacy/consents/{policyType}:
    put:
      operationId: setConsentDecision
      security: [{ bearerAuth: [] }]
      tags: [Privacy]
      parameters:
        - { name: policyType, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Consent decision persisted } }
  /privacy/data-requests:
    get:
      operationId: listDataRequests
      security: [{ bearerAuth: [] }]
      tags: [Privacy]
      responses: { '200': { description: Data request page } }
    post:
      operationId: createDataRequest
      security: [{ bearerAuth: [] }]
      tags: [Privacy]
      responses: { '202': { description: Request accepted } }
  /oauth/clients:
    get:
      operationId: listOAuthClients
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      responses: { '200': { description: Workspace OAuth clients, secret material omitted, content: { application/json: { schema: { $ref: '#/components/schemas/ItemListOAuthClient' } } } } }
    post:
      operationId: createOAuthClient
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClientCreate' } } }
      responses: { '201': { description: Client secret is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClientSecretResponse' } } } } }
  /oauth/clients/{clientId}:
    get:
      operationId: getOAuthClient
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters: [{ name: clientId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OAuth client without secret, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClient' } } } } }
    patch:
      operationId: updateOAuthClient
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters: [{ name: clientId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClientPatch' } } }
      responses: { '200': { description: Updated OAuth client, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthClient' } } } } }
    delete:
      operationId: deleteOAuthClient
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters: [{ name: clientId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Client revoked } }
  /oauth/authorize:
    get:
      operationId: authorizeOAuthClient
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string, pattern: '^wama_client_[A-Za-z0-9_-]{16,80}$' } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: response_type, in: query, required: false, schema: { type: string, enum: [code], default: code } }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 128 } }
        - { name: code_challenge_method, in: query, required: false, schema: { type: string, enum: [S256], default: S256 } }
        - { name: scope, in: query, required: false, schema: { type: string, default: openid } }
        - { name: state, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 256 } }
      responses: { '200': { description: WorkAMA JSON authorization code; browser redirect/provider exchange remains pending_external, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthAuthorizationResponse' } } } } }
  /oauth/token:
    post:
      operationId: exchangeOAuthToken
      tags: [OpenPlatform]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OAuthTokenRequest' } } }
      responses: { '200': { description: Access and refresh tokens; token material is never persisted in plaintext, content: { application/json: { schema: { $ref: '#/components/schemas/OAuthTokenResponse' } } } } }
  /oauth/revocations:
    post:
      operationId: revokeOAuthToken
      tags: [OpenPlatform]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OAuthRevokeRequest' } } }
      responses: { '204': { description: Access or refresh token revoked } }
  /webhooks:
    get:
      operationId: listWebhooks
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      responses: { '200': { description: Workspace webhooks, secret material omitted, content: { application/json: { schema: { $ref: '#/components/schemas/ItemListWebhook' } } } } }
    post:
      operationId: createWebhook
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookCreate' } } }
      responses: { '201': { description: Webhook secret is returned once, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSecretResponse' } } } } }
  /webhooks/{webhookId}:
    get:
      operationId: getWebhook
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Webhook without secret, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } } }
    patch:
      operationId: updateWebhook
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookPatch' } } }
      responses: { '200': { description: Updated webhook, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } } }
    delete:
      operationId: deleteWebhook
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: Webhook revoked } }
  /webhooks/{webhookId}/tests:
    post:
      operationId: testWebhook
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters: [{ name: webhookId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookTestRequest' } } }
      responses: { '200': { description: Delivery queued; controlled mock may complete locally, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDeliveryResponse' } } } } }
  /webhooks/{webhookId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      security: [{ bearerAuth: [] }]
      tags: [OpenPlatform]
      parameters:
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: Webhook delivery history, content: { application/json: { schema: { $ref: '#/components/schemas/ItemListWebhookDelivery' } } } } }
  /a2a/agent-cards:
    get:
      operationId: listA2AAgentCards
      security: [{ bearerAuth: [] }]
      tags: [A2A]
      responses: { '200': { description: Workspace Agent Cards with fingerprint-only trusted keys, content: { application/json: { schema: { $ref: '#/components/schemas/ItemListAgentCard' } } } } }
    post:
      operationId: createA2AAgentCard
      security: [{ bearerAuth: [] }]
      tags: [A2A]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentCardCreate' } } }
      responses: { '201': { description: Agent Card created, content: { application/json: { schema: { $ref: '#/components/schemas/AgentCard' } } } } }
  /a2a/agent-cards/{cardId}:
    patch:
      operationId: updateA2AAgentCard
      security: [{ bearerAuth: [] }]
      tags: [A2A]
      parameters: [{ name: cardId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentCardPatch' } } }
      responses: { '200': { description: Updated Agent Card, content: { application/json: { schema: { $ref: '#/components/schemas/AgentCard' } } } } }
  /a2a/public/agent-cards/{cardId}:
    get:
      operationId: getPublicA2AAgentCard
      tags: [A2A]
      parameters: [{ name: cardId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Public discovery card with fingerprint-only trusted keys and no workspace_id, content: { application/json: { schema: { $ref: '#/components/schemas/PublicAgentCard' } } } } }
  /a2a/tasks:
    post:
      operationId: createA2ATask
      security: [{ bearerAuth: [] }]
      tags: [A2A]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/A2ATaskCreate' } } }
      responses: { '202': { description: Task accepted and remains pending_external until an external execution boundary is proven, content: { application/json: { schema: { $ref: '#/components/schemas/A2ATaskResponse' } } } } }
  /a2a/tasks/{taskId}:
    get:
      operationId: getA2ATask
      security: [{ bearerAuth: [] }]
      tags: [A2A]
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: A2A task, content: { application/json: { schema: { $ref: '#/components/schemas/A2ATaskResponse' } } } } }
  /a2a/tasks/{taskId}/updates:
    post:
      operationId: updateA2ATask
      security: [{ bearerAuth: [] }]
      tags: [A2A]
      parameters: [{ name: taskId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/A2ATaskUpdate' } } }
      responses: { '200': { description: Local update only; does not prove external execution, content: { application/json: { schema: { $ref: '#/components/schemas/A2ATaskResponse' } } } } }
  /external-apps:
    get:
      operationId: listExternalApps
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      responses: { '200': { description: Workspace external apps, credentials and endpoint details are masked, content: { application/json: { schema: { $ref: '#/components/schemas/ItemListExternalApp' } } } } }
    post:
      operationId: createExternalApp
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExternalAppCreate' } } }
      responses: { '201': { description: External app created, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApp' } } } } }
  /external-apps/{appId}:
    get:
      operationId: getExternalApp
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters: [{ name: appId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: External app detail, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApp' } } } } }
    patch:
      operationId: updateExternalApp
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters: [{ name: appId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExternalAppPatch' } } }
      responses: { '200': { description: Updated external app, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalApp' } } } } }
  /external-apps/{appId}/invocations:
    get:
      operationId: listExternalAppInvocations
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters:
        - { name: appId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: Invocation history, content: { application/json: { schema: { $ref: '#/components/schemas/ItemListExternalInvocation' } } } } }
    post:
      operationId: invokeExternalApp
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters: [{ name: appId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExternalInvocationCreate' } } }
      responses: { '202': { description: Controlled mock and http_test may complete; external provider execution remains pending_external or blocked, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalInvocationResponse' } } } } }
  /marketplace/templates:
    get:
      operationId: listMarketplaceTemplates
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters: [{ name: template_type, in: query, required: false, schema: { type: string, enum: [assistant, workflow, skill] } }]
      responses: { '200': { description: Templates visible to the workspace, content: { application/json: { schema: { $ref: '#/components/schemas/ItemListTemplate' } } } } }
    post:
      operationId: createMarketplaceTemplate
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TemplateCreate' } } }
      responses: { '201': { description: Template created, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } } }
  /marketplace/templates/{templateId}/reviews:
    post:
      operationId: reviewMarketplaceTemplate
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TemplateReview' } } }
      responses: { '200': { description: Review status updated, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } } }
  /marketplace/templates/{templateId}/publish:
    post:
      operationId: publishMarketplaceTemplate
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Template published, content: { application/json: { schema: { $ref: '#/components/schemas/Template' } } } } }
  /marketplace/templates/{templateId}/copies:
    post:
      operationId: copyMarketplaceTemplate
      security: [{ bearerAuth: [] }]
      tags: [ExternalApps]
      parameters: [{ name: templateId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TemplateCopy' } } }
      responses: { '201': { description: Copy accepted; materialization remains pending_template_materialization, content: { application/json: { schema: { $ref: '#/components/schemas/TemplateCopyResponse' } } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    User:
      type: object
      required: [id, email, display_name, workspace_id, org_id, role]
      properties:
        id: { type: string, pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$' }
        email: { type: string, format: email }
        display_name: { type: string }
        workspace_id: { type: string }
        org_id: { type: string }
        role: { type: string, enum: [owner, admin, member, viewer] }
        onboarding_completed: { type: boolean }
    GatewayModelMappingRequest:
      type: object
      required: [model, channel_id, upstream_model]
      properties:
        model: { type: string, minLength: 1, maxLength: 120, description: Unified caller-visible model name }
        channel_id: { type: string, description: Workspace-owned gateway channel id }
        upstream_model: { type: string, minLength: 1, maxLength: 120, description: Provider model name used during forwarding }
    GatewayTokenCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        rpm_limit: { type: integer, minimum: 1, maximum: 100000, default: 60 }
        tpm_limit: { type: integer, minimum: 1, default: 100000 }
        model_whitelist: { type: array, items: { type: string }, default: [] }
        pinned_channel_id:
          type: [string, 'null']
          description: Enabled workspace channel preferred before weighted failover candidates.
        group_id:
          type: [string, 'null']
          description: Enabled workspace token group whose policy additionally constrains the key.
    GatewayTokenGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        rpm_limit: { type: integer, minimum: 1, maximum: 1000000, default: 600 }
        tpm_limit: { type: integer, minimum: 1, default: 1000000 }
        model_whitelist: { type: array, items: { type: string }, default: [] }
        pinned_channel_id: { type: [string, 'null'] }
        fallback_chain:
          type: object
          default: {}
          description: Chat-only ordered fallback models keyed by the caller-visible primary model.
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 5
            items: { type: string, minLength: 1, maxLength: 120 }
        model_mapping_override:
          type: object
          default: {}
          description: Token-group mappings override workspace mappings. Each model maps enabled workspace channel ids to provider model names.
          additionalProperties:
            type: object
            minProperties: 1
            additionalProperties: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [enabled, disabled], default: enabled }
    OAuthClientCreate:
      type: object
      additionalProperties: false
      required: [name, redirect_uris]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        redirect_uris: { type: array, minItems: 1, maxItems: 16, items: { type: string, format: uri } }
