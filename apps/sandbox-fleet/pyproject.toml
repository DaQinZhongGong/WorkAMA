[project]
name = "workama-sandbox-fleet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.14",
  "uvicorn[standard]==0.34.3",
  "pydantic-settings==2.10.1",
  "docker==7.1.0",
  "psycopg[binary,pool]==3.2.9",
  "nats-py==2.11.0",
  "minio==7.2.15",
]

[dependency-groups]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv.workspace]
members = []
