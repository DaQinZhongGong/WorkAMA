    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <link rel="preconnect" href="http://localhost:20202" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="http://localhost:20200" />

    <!-- 运行时配置：必须在模块脚本之前加载（容器入口会重写此文件，见 docker-entrypoint.sh） -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.addEventListener('load', () => {
        if (!('serviceWorker' in navigator)) return
        navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' })
          .then((registration) => registration.update())
          .catch(() => {})
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
