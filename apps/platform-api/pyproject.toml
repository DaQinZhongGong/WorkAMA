[project]
name = "workama-platform"
version = "7.176.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
enterprise = ["signxml>=4.0", "python-jose[cryptography]>=3.3"]
community = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "../../packages/py-common"]
testpaths = ["tests"]
asyncio_mode = "auto"
