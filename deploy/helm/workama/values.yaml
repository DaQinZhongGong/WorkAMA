global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  domain: workama.local

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

secrets:
  jwtSecret: change-this-jwt-secret
  jwtPrivateKey: ""
  jwtPublicKey: ""
  internalToken: change-this-internal-token
  keyPepper: change-this-key-pepper
  encryptionKey: QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI=

web:
  platformApiUrl: ""
  agentWsUrl: ""

# ---------------------------------------------------------------------------
# Application services
#   - platform-api/gateway/web default replicas=2 with HPA + PDB
#   - all services ship with production-grade resources, securityContext,
#     liveness/readiness probes and support affinity/tolerations/
#     topologySpreadConstraints overrides.
# ---------------------------------------------------------------------------
appServices:
  platform-api:
    image: workama-platform-api
    tag: latest
    replicas: 2
    port: 8000
    service: true
    healthPath: /healthz
    readyPath: /readyz
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  platform-worker:
    image: workama-platform-worker
    tag: latest
    replicas: 1
    port: 8000
    service: false
    command: ["python", "-m", "workama_platform.worker"]
    healthPath: /healthz
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  rag-worker:
    image: workama-rag-worker
    tag: latest
    replicas: 1
    port: 8000
    service: false
    command: ["python", "-m", "workama_platform.rag_worker"]
    healthPath: /healthz
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  gateway:
    image: workama-gateway
    tag: latest
    replicas: 2
    port: 8080
    service: true
    healthPath: /healthz
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  agent-server:
    image: workama-agent-server
    tag: latest
    replicas: 1
    port: 8001
    service: true
    healthPath: /healthz
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  sandbox-fleet:
    image: workama-sandbox-fleet
    tag: latest
    replicas: 1
    port: 8002
    service: true
    healthPath: /healthz
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    # sandbox-fleet may need privileged access to container runtime; keep
    # allowPrivilegeEscalation false but runAsNonRoot false when using
    # dockerSocket or gVisor host runtime.
    securityContext:
      runAsNonRoot: false
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
  sandbox-agentd:
    enabled: false
    image: workama-sandbox-agentd
    tag: local
    replicas: 1
    port: 9000
    service: false
    command: ["/usr/local/bin/sandbox-agentd"]
  web:
    image: workama-web
    tag: latest
    replicas: 2
    port: 3000
    service: true
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    pdb:
      enabled: true
      minAvailable: 1
    livenessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    securityContext:
      runAsNonRoot: true
      runAsUser: 101
      runAsGroup: 101
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

sandboxFleet:
  image: workama-sandbox-agentd:local
  runtime: runc
  requireGvisor: false
  dockerSocket:
    enabled: false
    path: /var/run/docker.sock

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  database: workama
  username: workama
  password: workama_dev
  storage: 20Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

redis:
  enabled: true
  image: redis:7-alpine
  storage: 5Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

nats:
  enabled: true
  image: nats:2-alpine
  storage: 10Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

minio:
  enabled: true
  image: minio/minio:latest
  accessKey: workama
  secretKey: workama_minio
  storage: 50Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Fallback resources used by services that do not define per-service
# resources. Per-service values win over this default.
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Pod-level security context applied to all workama pods (in addition to
# the per-container securityContext defined under appServices.*).
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  runAsNonRoot: true
  fsGroup: 10001

# Default container securityContext applied when a service does not define
# its own securityContext. Keeps the chart production-grade by default.
defaultSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Scheduling knobs: empty by default (dev-friendly), overridable per service
# or globally for production multi-AZ / dedicated node-pool deployments.
affinity: {}
tolerations: []
topologySpreadConstraints: []

# ---------------------------------------------------------------------------
# NetworkPolicy: deny all ingress by default, only allow intra-namespace
# traffic. Production deployments should tighten further via overrides.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  ingressFromSameNamespace: true

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: workama.local
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: platform-api
        - path: /v1
          pathType: Prefix
          service: gateway
        - path: /ws
          pathType: Prefix
          service: agent-server
  tls: []
