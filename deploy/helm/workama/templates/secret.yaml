apiVersion: v1
kind: Secret
metadata:
  name: {{ include "workama.fullname" . }}-secrets
  labels:
    {{- include "workama.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_PRIVATE_KEY: {{ .Values.secrets.jwtPrivateKey | quote }}
  JWT_PUBLIC_KEY: {{ .Values.secrets.jwtPublicKey | quote }}
  INTERNAL_TOKEN: {{ .Values.secrets.internalToken | quote }}
  KEY_PEPPER: {{ .Values.secrets.keyPepper | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.username (urlquery .Values.postgres.password) (include "workama.fullname" .) .Values.postgres.database | quote }}
  MINIO_ROOT_USER: {{ .Values.minio.accessKey | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.secretKey | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secretKey | quote }}
